[colors]
transparent = #00000000
surface-blur = #B3282a36
text = #f8f8f2
subtext = #6272a4
blue = #8be9fd
red = #ff5555
green = #50fa7b
yellow = #f1fa8c

[bar/main]
width = 100%
height = 38
radius = 18

; Impostiamo lo sfondo semi-trasparente
background = ${colors.surface-blur}
foreground = ${colors.text}

border-top-size = 4
border-bottom-size = 4
border-left-size = 12
border-right-size = 12
border-color = ${colors.transparent}

padding-left = 3
padding-right = 3
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=11;3"
enable-ipc = true
cursor-click = pointer

modules-left = i3 xwindow
modules-center = music
modules-right = audio_output pulseaudio memory cpu temperature tray time

; =======================================
; MODULI
; =======================================
[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
format = <label-state> <label-mode>
label-focused = %name%
label-focused-foreground = ${colors.blue}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.text}
label-unfocused-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.subtext}
label-empty = Desktop
label-empty-foreground = ${colors.subtext}

[module/music]
type = custom/script
exec-if = playerctl status 2>/dev/null
exec = playerctl metadata --format '󰎆 {{ artist }} - {{ title }}' 2>/dev/null
interval = 2
label = %output%
label-foreground = ${colors.blue}

[module/audio_output]
type = custom/script
exec = ~/.config/i3/scripts/current-audio-output.sh
interval = 1
label = %output%
label-foreground = ${colors.yellow}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-muted = 󰖁 Muted
label-muted-foreground = ${colors.red}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.blue}

[module/memory]
type = internal/memory
interval = 5
label =  %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
label =  %percentage%%

[module/temperature]
type = custom/script
exec = sensors | grep -m 1 -E 'Tctl|Tdie|edge' | awk '{print $2}' | tr -d '+' | sed 's/\.[0-9]*//'
interval = 2
label =  %output%

[module/time]
type = internal/date
interval = 60
date = %Y-%m-%d %H:%M
label =  %date%
label-foreground = ${colors.blue}

[module/tray]
type = internal/tray
; Usa lo stesso sfondo semi-trasparente del resto della barra
tray-background = ${colors.surface-blur}
format-background = ${colors.surface-blur}
; Spazio tra un'icona e l'altra
tray-spacing = 8px
; Spazio ai lati del blocco tray
tray-padding = 4px
; Usa un valore fisso in pixel (es. 16, 18 o 20) invece di 60% per impedire che le icone escano dai bordi
tray-size = 22
